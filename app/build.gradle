plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.labibledufoot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.labibledufoot'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            res.srcDirs += ["$buildDir/generated/rootImagesRes"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedImagesDir = file("$buildDir/generated/rootImagesRes/drawable")

tasks.register('prepareInterfaceImages', Copy) {
    from(rootProject.projectDir) {
        include 'logo_app.png'
        include 'header_accueil.png'
        include 'splash_scree.png'
        include 'rubrique_technique.png'
        include 'rubrique_tactique.png'
        include 'rubrique_defense.png'
        include 'rubrique_milieu.png.png'
        include 'rubrique_attaque.png'
        include 'rubrique_gardien.png'
        include 'rubrique_vitesse.png'
    }
    rename { String fileName ->
        if (fileName == 'rubrique_milieu.png.png') return 'rubrique_milieu.png'
        if (fileName == 'splash_scree.png') return 'splash_screen.png'
        return fileName
    }
    into(generatedImagesDir)
}

tasks.named('preBuild').configure {
    dependsOn('prepareInterfaceImages')
}
